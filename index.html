    <div class="pres-index ${PR.indexOpen?'open':''}">
      <div class="pres-index-h"><span>Índice — toque para ir direto</span><button class="pres-ic" data-presindex>×</button></div>
      <div class="pres-index-grid">
        ${PR.qs.map((qq,k)=>{ const a=PR.answers[k]; let st=''; if(a>=0) st=(a===qq.ans)?'ok':'no'; return `<button class="pres-ix ${k===i?'cur':''} ${st}" data-presjump="${k}"><b>${k+1}</b><span>${esc(qq.q).slice(0,46)}${qq.q.length>46?'…':''}</span></button>`; }).join('')}
      </div>
    </div>
  </div>`;
}
function presAnswer(oi){ if(PR.answers[PR.i]>=0) return; PR.answers[PR.i]=oi; presRender(); }
function presJump(k){ PR.i=k; PR.indexOpen=false; presRender(); }
function presPrev(){ if(PR.i>0){ PR.i--; presRender(); } }
function presNext(){ if(PR.i+1<PR.total){ PR.i++; presRender(); } }
function presToggleIndex(){ PR.indexOpen=!PR.indexOpen; presRender(); }
function presResult(){
  const qs=PR.qs,ans=PR.answers; let right=0; const wrong=[];
  qs.forEach((q,i)=>{ if(ans[i]===q.ans) right++; else wrong.push({q,you:ans[i]}); });
  const total=qs.length,pct=Math.round(right/total*100),pass=pct>=70;
  const rev=wrong.map(w=>`<div class="rev"><div class="rq">${esc(w.q.q)}</div><div class="ra you">✗ Sua resposta: ${w.you>=0?esc(w.q.opts[w.you]):'(sem resposta)'}</div><div class="ra cor">✓ Correta: ${esc(w.q.opts[w.q.ans])}</div>${w.q.ex?`<div class="rex">${esc(w.q.ex)}</div>`:''}</div>`).join('');
  $('#presRoot').innerHTML=`<div class="pres-cfg"><div class="pres-result-box modal-wrap">
    <button class="mclose" data-presclose>×</button>
    <div class="m-eyebrow">Resultado</div>
    <div class="res-score">${pct}%</div>
    <div class="res-verdict ${pass?'pass':'fail'}">${pass?'✓ Muito bom!':'✗ Continue revisando'}</div>
    <div class="res-stats"><span>Acertos <b>${right}</b></span><span>Erros <b>${total-right}</b></span><span>Total <b>${total}</b></span></div>
    ${wrong.length?`<div class="res-review-h">Revisão de erros (${wrong.length})</div>${rev}`:'<p style="text-align:center;color:var(--green)">Gabaritou! 🎯</p>'}
    <div class="res-actions"><button class="btn-gold" data-presretry>Nova apresentação</button><button class="btn" data-presclose style="flex:1">Fechar</button></div>
  </div></div>`;
}
function presClose(){ if(document.fullscreenElement) document.exitFullscreen&&document.exitFullscreen(); const el=$('#presRoot'); if(el){ el.classList.remove('open'); el.innerHTML=''; } PR=null; }

/* =====================================================================
   TEMA / CORES (+ modo polícia)
   ===================================================================== */
const THEME_PRESETS=[
  {id:'gold',name:'Elite Dourado',accent:'#e8c66b',police:false},
  {id:'police',name:'Polícia (Azul/Verm.)',accent:'#2f6bff',police:true},
  {id:'blue',name:'Azul Tático',accent:'#3b82f6',police:false},
  {id:'red',name:'Vermelho',accent:'#e0384a',police:false},
  {id:'green',name:'Verde',accent:'#22c55e',police:false},
  {id:'cyan',name:'Ciano',accent:'#22d3ee',police:false},
  {id:'purple',name:'Roxo',accent:'#a855f7',police:false},
  {id:'orange',name:'Laranja',accent:'#f97316',police:false}
];
function hexToRgb(h){ h=(h||'').replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h||'0',16)||0; return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(rgb,t,a){ return rgb.map((c,i)=>Math.round(c+(t[i]-c)*a)); }
function rgbStr(a){ return 'rgb('+a[0]+','+a[1]+','+a[2]+')'; }
function rgba(a,al){ return 'rgba('+a[0]+','+a[1]+','+a[2]+','+al+')'; }
function applyTheme(){
  try{
    const t=DOC.theme||{}; const accent=t.accent||'#e8c66b'; const rgb=hexToRgb(accent);
    const lighter=mix(rgb,[255,255,255],.62), light=mix(rgb,[255,255,255],.42);
    const dark=mix(rgb,[0,0,0],.30), darker=mix(rgb,[0,0,0],.58);
    const R=document.documentElement.style;
    R.setProperty('--gold',accent);
    R.setProperty('--gold-b',rgbStr(lighter));
    R.setProperty('--gold-d',rgbStr(dark));
    R.setProperty('--gold-dd',rgbStr(darker));
    R.setProperty('--gg','linear-gradient(135deg,'+rgbStr(lighter)+' 0%,'+rgbStr(light)+' 46%,'+rgbStr(dark)+' 100%)');
    R.setProperty('--gg-soft','linear-gradient(135deg,'+rgba(rgb,.16)+','+rgba(rgb,.06)+')');
    R.setProperty('--line',rgba(rgb,.16));
    R.setProperty('--line3',rgba(rgb,.34));
    document.body.classList.toggle('police', !!t.police);
  }catch(e){ console.error(e); }
}
/* seletor de cores (editor) */
function openTheme(){
  const cur=(DOC.theme&&DOC.theme.accent)||'#e8c66b';
  const sw=THEME_PRESETS.map(p=>`<button class="sw ${((DOC.theme&&DOC.theme.accent)||'').toLowerCase()===p.accent.toLowerCase()?'sel':''}" data-preset="${p.id}" title="${p.name}"><span style="background:${p.accent}"></span>${p.name}</button>`).join('');
  $('#themeBg').innerHTML=`<div class="modal modal-wrap">
    <button class="mclose" data-themeclose>×</button>
    <h3>🎨 Cores do site</h3><p>Escolha um tema ou uma cor personalizada. Vale para todos.</p>
    <div class="sw-grid">${sw}</div>
    <div class="theme-custom"><label>Cor personalizada</label><input type="color" id="themeColor" value="${cur}"></div>
    <label class="theme-police"><input type="checkbox" id="themePolice" ${DOC.theme&&DOC.theme.police?'checked':''}> Ativar efeito de luzes da polícia (barra azul/vermelha)</label>
    <div class="row"><button class="btn" data-themeclose>Fechar</button><button class="btn primary" data-themeapply>Aplicar</button></div>
  </div>`;
  $('#themeBg').classList.add('open');
}
function themeApply(){
  const c=$('#themeColor').value; const pol=$('#themePolice').checked;
  DOC.theme={accent:c, police:pol}; applyTheme(); scheduleSave(); $('#themeBg').classList.remove('open'); toast('Cores aplicadas.','ok');
}

/* =====================================================================
   MODO FOCADO (apresentação do material em tela cheia + índice)
   ===================================================================== */
let FO=null;
function focusOpen(){
  const secs=$$('#secSlot .section'); if(!secs.length) return;
  FO={i:0, total:secs.length, indexOpen:false};
  const el=$('#focusRoot'); if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
  el.classList.add('open'); focusRender();
}
function focusRender(){
  const el=$('#focusRoot'); if(!el||!FO) return;
  const secs=$$('#secSlot .section'); const i=Math.min(FO.i,secs.length-1), total=secs.length;
  const titles=(DOC.sections||[]).map(s=>s.title);
  el.innerHTML=`<div class="focus">
    <div class="pres-top">
      <button class="pres-ic" data-foindex title="Índice">☰</button>
      <div class="pres-ttl">Modo Focado</div>
      <div class="pres-meta"><span class="pres-count">${i+1} / ${total}</span>
        <button class="pres-ic" data-fofs title="Tela cheia">⛶</button>
        <button class="pres-ic" data-foclose title="Sair">×</button></div>
    </div>
    <div class="pres-bar"><i style="width:${(i+1)/total*100}%"></i></div>
    <div class="focus-stage" id="focusStage"></div>
    <div class="pres-nav">
      <button class="pres-arrow" data-foprev ${i===0?'disabled':''}>‹</button>
      <div class="pres-nav-mid"><span class="pres-hint">deslize ou use ‹ › · toque ☰ para o índice</span></div>
      <button class="pres-arrow" data-fonext ${i+1>=total?'disabled':''}>›</button>
    </div>
    <div class="pres-index ${FO.indexOpen?'open':''}">
      <div class="pres-index-h"><span>Índice — toque para ir direto</span><button class="pres-ic" data-foindex>×</button></div>
      <div class="pres-index-grid">
        ${titles.map((t,k)=>`<button class="pres-ix ${k===i?'cur':''}" data-fojump="${k}"><b>${k+1}</b><span>${esc(t)}</span></button>`).join('')}
      </div>
    </div>
  </div>`;
  const stage=$('#focusStage'); const clone=secs[i].cloneNode(true); clone.removeAttribute('id');
  const wrap=document.createElement('div'); wrap.className='focus-slide'; wrap.appendChild(clone); stage.appendChild(wrap);
}
function focusJump(k){ FO.i=k; FO.indexOpen=false; focusRender(); }
function focusPrev(){ if(FO.i>0){ FO.i--; focusRender(); } }
function focusNext(){ const secs=$$('#secSlot .section'); if(FO.i+1<secs.length){ FO.i++; focusRender(); } }
function focusToggleIndex(){ FO.indexOpen=!FO.indexOpen; focusRender(); }
function focusClose(){ if(document.fullscreenElement) document.exitFullscreen&&document.exitFullscreen(); const el=$('#focusRoot'); if(el){ el.classList.remove('open'); el.innerHTML=''; } FO=null; }

/* ---- AJUSTES DE LEITURA (tamanho da fonte, por usuário) ---- */
let READER={scale:1};
try{ READER=Object.assign(READER, JSON.parse(localStorage.getItem('dip_reader_v1')||'{}')); }catch(e){}
function applyReader(){ try{ document.documentElement.style.fontSize=(17*(READER.scale||1))+'px'; }catch(e){} }
function saveReader(){ try{ localStorage.setItem('dip_reader_v1', JSON.stringify(READER)); }catch(e){} }
function openSettings(){
  const s=READER.scale||1; const b=(v,l)=>`<button class="fbtn2 ${Math.abs(s-v)<0.03?'sel':''}" data-scale="${v}">${l}</button>`;
  $('#setBg').innerHTML=`<div class="modal modal-wrap">
    <button class="mclose" data-setclose>×</button>
    <h3>Aa · Ajustes de leitura</h3><p>Escolha o tamanho de letra ideal pra você. Fica salvo neste aparelho.</p>
    <div class="set-row"><span>Tamanho da letra</span><div class="fontsize">${b(0.9,'A−')}${b(1,'A')}${b(1.15,'A+')}${b(1.35,'A++')}</div></div>
    <div class="row"><button class="btn primary" data-setclose style="width:100%">Pronto</button></div>
  </div>`;
  $('#setBg').classList.add('open');
}

function wireFeatures(){
  const fs=$('#fabSim'); if(fs) fs.onclick=simIntro;
  const ff=$('#fabFc'); if(ff) ff.onclick=openFlashcards;
  const ft=$('#fabTop'); if(ft){ ft.onclick=()=>window.scrollTo({top:0,behavior:'smooth'}); window.addEventListener('scroll',()=>ft.classList.toggle('show',window.scrollY>500),{passive:true}); }
  const bq=$('#btnQuiz'); if(bq) bq.onclick=presOpen;
  const bfoc=$('#btnFocus'); if(bfoc) bfoc.onclick=focusOpen;
  const bset=$('#btnSettings'); if(bset) bset.onclick=openSettings;
  const bfs=$('#btnFs'); if(bfs) bfs.onclick=()=>toggleFs(document.documentElement);
  document.addEventListener('click',e=>{
    const P=s=>e.target.closest(s);
    // simulado
    if(P('[data-simpick]')){ SIM.pick=+P('[data-simpick]').dataset.simpick; $('#simBg').querySelectorAll('.sim-opt').forEach(o=>o.classList.toggle('sel',+o.dataset.simpick===SIM.pick)); }
    else if(P('[data-simstart]')) simStart();
    else if(P('[data-sima]')) simSelect(+P('[data-sima]').dataset.sima);
    else if(P('[data-simnext]')) simAdvance();
    else if(P('[data-simretry]')) simIntro();
    else if(P('[data-simclose]')||P('[data-simabort]')){ if(SIM&&SIM.timer)clearInterval(SIM.timer); closeModal('#simBg'); }
    // flashcards
    else if(P('#fcCard')){ FC.flip=!FC.flip; const el=$('#fcCard'); if(el)el.classList.toggle('flip',FC.flip); }
    else if(P('[data-fcnext]')){ FC.i=(FC.i+1)%FC.cards.length; FC.flip=false; fcRender(); }
    else if(P('[data-fcprev]')){ FC.i=(FC.i-1+FC.cards.length)%FC.cards.length; FC.flip=false; fcRender(); }
    else if(P('[data-fcshuffle]')){ FC.cards=shuffle(FC.cards); FC.i=0; FC.flip=false; fcRender(); }
    else if(P('[data-fcclose]')) closeModal('#fcBg');
    // hub (central de avaliação no quiz)
    else if(P('[data-openpres]')) presOpen();
    else if(P('[data-markall]')){ (DOC.sections||[]).forEach((s,i)=>{ STUDIED[s.id||'sec'+i]=1; }); saveStudied(); render(); toast('Todas marcadas como estudadas.','ok'); }
    else if(P('[data-clearprog]')){ STUDIED={}; saveStudied(); render(); toast('Progresso limpo.','ok'); }
    else if(P('[data-scale]')){ READER.scale=parseFloat(P('[data-scale]').dataset.scale)||1; applyReader(); saveReader(); openSettings(); }
    else if(P('[data-setclose]')) closeModal('#setBg');
    else if(P('[data-openexam]')) examConfig();
    else if(P('[data-opensim]')) simIntro();
    else if(P('[data-openfc]')) openFlashcards();
    // apresentação
    else if(P('[data-presa]')) presAnswer(+P('[data-presa]').dataset.presa);
    else if(P('[data-presjump]')) presJump(+P('[data-presjump]').dataset.presjump);
    else if(P('[data-presprev]')) presPrev();
    else if(P('[data-presnext]')) presNext();
    else if(P('[data-presindex]')) presToggleIndex();
    else if(P('[data-presfs]')) toggleFs($('#presRoot'));
    else if(P('[data-presresult]')) presResult();
    else if(P('[data-presretry]')) presOpen();
    else if(P('[data-presclose]')) presClose();
    // modo focado
    else if(P('[data-fojump]')) focusJump(+P('[data-fojump]').dataset.fojump);
    else if(P('[data-foprev]')) focusPrev();
    else if(P('[data-fonext]')) focusNext();
    else if(P('[data-foindex]')) focusToggleIndex();
    else if(P('[data-fofs]')) toggleFs($('#focusRoot'));
    else if(P('[data-foclose]')) focusClose();
    // prova
    else if(P('[data-expick]')){ EX.pick=+P('[data-expick]').dataset.expick; $('#examRoot').querySelectorAll('.sim-opt').forEach(o=>o.classList.toggle('sel',+o.dataset.expick===EX.pick)); }
    else if(P('[data-exstart]')) examStart();
    else if(P('[data-exa]')){ EX.answers[EX.i]=+P('[data-exa]').dataset.exa; examRender(); }
    else if(P('[data-exnext]')){ if(EX.i+1<EX.total){ EX.i++; examRender(); } }
    else if(P('[data-exprev]')){ if(EX.i>0){ EX.i--; examRender(); } }
    else if(P('[data-expal]')){ EX.i=+P('[data-expal]').dataset.expal; examRender(); }
    else if(P('[data-exfinish]')) examFinish();
    else if(P('[data-exabort]')||P('[data-exclose]')) examExit();
    else if(P('[data-exretry]')) examConfig();
    // lightbox
    else if(P('[data-lightbox]') && !IS_EDITOR){ openLightbox(P('[data-lightbox]').dataset.lightbox); }
    else if(P('[data-lbclose]')) lbClose();
    else if(P('[data-lbfs]')){ toggleFs($('#lightbox')); }
    else if(P('[data-lbprev]')){ LB.i=(LB.i-1+LB.list.length)%LB.list.length; lbRender(); }
    else if(P('[data-lbnext]')){ LB.i=(LB.i+1)%LB.list.length; lbRender(); }
  });
  ['#simBg','#fcBg','#setBg'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('click',ev=>{ if(ev.target===el){ if(SIM&&SIM.timer)clearInterval(SIM.timer); el.classList.remove('open'); } }); });
  // deslizar (celular) na apresentação e no modo focado
  let tsX=0,tsY=0;
  const overlayOpen=()=>{ const pr=$('#presRoot'), fo=$('#focusRoot'); return (pr&&pr.classList.contains('open'))||(fo&&fo.classList.contains('open')); };
  document.addEventListener('touchstart',ev=>{ if(!overlayOpen())return; const t=ev.changedTouches[0]; tsX=t.clientX; tsY=t.clientY; },{passive:true});
  document.addEventListener('touchend',ev=>{ if(!overlayOpen())return; if((PR&&PR.indexOpen)||(FO&&FO.indexOpen))return; const t=ev.changedTouches[0]; const dx=t.clientX-tsX, dy=t.clientY-tsY; if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.4){ const foOpen=$('#focusRoot')&&$('#focusRoot').classList.contains('open'); if(dx<0){ foOpen?focusNext():presNext(); } else { foOpen?focusPrev():presPrev(); } } },{passive:true});
  const lb=$('#lightbox'); if(lb) lb.addEventListener('click',ev=>{ if(ev.target===lb) lbClose(); });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ closeModal('#simBg'); closeModal('#fcBg'); if($('#lightbox')&&$('#lightbox').classList.contains('open')) lbClose(); if($('#presRoot')&&$('#presRoot').classList.contains('open')) presClose(); if($('#focusRoot')&&$('#focusRoot').classList.contains('open')) focusClose(); }
    if($('#lightbox')&&$('#lightbox').classList.contains('open')){ if(e.key==='ArrowLeft'&&LB){ LB.i=(LB.i-1+LB.list.length)%LB.list.length; lbRender(); } if(e.key==='ArrowRight'&&LB){ LB.i=(LB.i+1)%LB.list.length; lbRender(); } }
    if(EX&&$('#examRoot')&&$('#examRoot').classList.contains('open')){ if(e.key==='ArrowRight'&&EX.qs){ if(EX.i+1<EX.total){EX.i++;examRender();} } if(e.key==='ArrowLeft'&&EX.qs){ if(EX.i>0){EX.i--;examRender();} } }
    if(PR&&$('#presRoot')&&$('#presRoot').classList.contains('open')){ if(e.key==='ArrowRight') presNext(); if(e.key==='ArrowLeft') presPrev(); }
    if(FO&&$('#focusRoot')&&$('#focusRoot').classList.contains('open')){ if(e.key==='ArrowRight') focusNext(); if(e.key==='ArrowLeft') focusPrev(); }
  });
}

/* =====================================================================
   INIT
   ===================================================================== */
loadThen(()=>{ render(); wireButtons(); wireChrome(); applyReader(); if(IS_EDITOR) setEditing(false); else wireFeatures(); });

})();

</script>
</body></html>
